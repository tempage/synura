[package]
name = "mock_server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "mock_server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
bytes = "1"
form_urlencoded = "1"
http = "1"
http-body-util = "0.1"
httpdate = "1.0"
mime_guess = "2"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }

[dev-dependencies]
wreq = { version = "=6.0.0-rc.28", features = ["brotli", "deflate", "gzip", "prefix-symbols", "zstd"] }
