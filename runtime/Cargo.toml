[package]
name = "synura-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.22"
boring2 = { version = "=5.0.0-alpha.13", features = ["prefix-symbols"] }
boring-sys = { package = "boring-sys2", version = "=5.0.0-alpha.13" }
encoding_rs = "0.8"
foreign-types = "0.5"
kuchiki = "0.8"
mime_guess = "2"
psl = "2.1.210"
rquickjs = { version = "0.11", features = ["bindgen"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
url = "2"
wreq = { version = "=6.0.0-rc.28", features = ["brotli", "deflate", "gzip", "prefix-symbols", "zstd"] }
zeroize = "1.8"
